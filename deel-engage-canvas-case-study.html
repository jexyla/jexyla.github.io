<script type="module">
// Unlock: derive the key from the password (PBKDF2-SHA256), decrypt the page (AES-GCM), then decrypt images as they near view.
const payload = JSON.parse(document.getElementById('payload').textContent);
const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const form = document.getElementById('lock-form');
const input = document.getElementById('lock-pass');
const error = document.getElementById('lock-error');
const STORE = 'deel-case-pass';

async function deriveKey(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

async function unlock(password) {
  const key = await deriveKey(password);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.ct)));
  document.getElementById('page').innerHTML = html;   // our own encrypted content
  try { sessionStorage.setItem(STORE, password); } catch {}
  showImages(key);
  await import('./src/case.js?v=4');                        // brand colours, logo, next card, header, reveals
  window.scrollTo(0, 0);
}

function showImages(key) {
  // Images and videos are decrypted when they come near the viewport, then shown from a temporary blob URL.
  const load = async el => {
    const fetchPlain = async cache => {
      const data = new Uint8Array(await (await fetch(el.dataset.locked, { cache })).arrayBuffer());
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
    };
    let plain;
    try { plain = await fetchPlain('default'); }
    catch { plain = await fetchPlain('reload'); }   // a stale cached copy from an earlier version: fetch it fresh
    el.src = URL.createObjectURL(new Blob([plain], { type: el.dataset.type }));
    if (el.tagName === 'VIDEO') el.play().catch(() => {});   // muted autoplay; the controls stay available
  };
  const io = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) { io.unobserve(e.target); load(e.target); }
  }, { rootMargin: '600px 0px' });
  document.querySelectorAll('img[data-locked], video[data-locked]').forEach(el => io.observe(el));
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true; error.textContent = '';
  try {
    await unlock(input.value);
  } catch {
    error.textContent = 'That password isn’t right. Please try again.';
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    input.select();
    button.disabled = false;
  }
});

// Already unlocked in this tab: open straight away.
let saved = null;
try { saved = sessionStorage.getItem(STORE); } catch {}
if (saved) unlock(saved).catch(() => { try { sessionStorage.removeItem(STORE); } catch {} });
</script>
